<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LaTeX CV Builder</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>body { margin: 0; }</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Types ----------
const emptyEntry = () => ({ title: "", org: "", location: "", start: "", end: "", bullets: [""] });

const initialData = {
  fullName: "", headline: "", city: "", phone: "", email: "", github: "", linkedin: "",
  birth: "", nationality: "",
  education: [{ title: "", org: "", location: "", start: "", end: "", bullets: [] }],
  gpa: "", gradingScale: "", thesis: "", relevantCourses: "",
  hasExperience: true,
  experience: [emptyEntry()],
  projects: [emptyEntry()],
  skills: { office: "", stats: "", tools: "", languages: "" },
  languageTests: "", standardizedTests: "",
  extras: "", gapExplanation: "",
  targetProgram: "", programLanguage: "English", specialRequirements: "",
};

const STEPS = ["Personal", "Education", "Experience", "Projects", "Skills & Languages", "Extras & Target"];

// ---------- Helpers ----------
const esc = (s) => (s || "").replace(/\\/g, "\\textbackslash{}").replace(/([&%$#_{}])/g, "\\$1").replace(/~/g, "\\textasciitilde{}").replace(/\^/g, "\\textasciicircum{}");
const pipe = (s) => esc(s).replace(/\|/g, "\\textbar{}");

function buildLatex(d) {
  const L = [];
  L.push(`\\documentclass[10pt,a4paper]{article}`);
  L.push(`\\usepackage[T1]{fontenc}`);
  L.push(`\\usepackage[utf8]{inputenc}`);
  L.push(`\\usepackage[margin=1.6cm,top=1.3cm,bottom=1.2cm]{geometry}`);
  L.push(`\\usepackage{enumitem}`);
  L.push(`\\usepackage{titlesec}`);
  L.push(`\\usepackage{xcolor}`);
  L.push(`\\usepackage[hidelinks]{hyperref}`);
  L.push(`\\pagestyle{empty}`);
  L.push(`\\setlength{\\parindent}{0pt}`);
  L.push(`\\setlist[itemize]{leftmargin=1.2em,itemsep=1pt,topsep=2pt,parsep=0pt}`);
  L.push(`\\titleformat{\\section}{\\bfseries\\large\\color[HTML]{1F3A5F}}{}{0pt}{}[\\vspace{-6pt}\\rule{\\linewidth}{0.5pt}]`);
  L.push(`\\titlespacing*{\\section}{0pt}{8pt}{4pt}`);
  L.push(`\\newcommand{\\entry}[3]{\\textbf{#1} \\hfill #2\\\\ \\textit{#3}\\par\\vspace{1pt}}`);
  L.push(`\\begin{document}`);

  L.push(`{\\LARGE\\bfseries ${pipe(d.fullName || "Your Name")}}\\\\[2pt]`);
  if (d.headline) L.push(`${pipe(d.headline)}\\\\[2pt]`);
  const contact = [d.city, d.phone, d.email, d.github ? `github.com/${d.github.replace(/^https?:\/\/github\.com\//, "")}` : "", d.linkedin ? `linkedin.com/in/${d.linkedin.replace(/^https?:\/\/(www\.)?linkedin\.com\/in\//, "")}` : ""].filter(Boolean).map(pipe).join(" \\textbullet{} ");
  if (contact) L.push(contact);
  const personal = [d.birth && `Born: ${d.birth}`, d.nationality].filter(Boolean).map(pipe).join(" \\textbullet{} ");
  if (personal) L.push(`\\vspace{2pt}\\\\ ${personal}`);

  const profileBits = [];
  if (d.targetProgram) profileBits.push(`Target: ${d.targetProgram} (${d.programLanguage}-taught)`);
  if (d.gapExplanation) profileBits.push(d.gapExplanation);
  L.push(``);
  L.push(`\\section*{Profile}`);
  L.push(profileBits.length ? `${pipe(profileBits.join(". "))}.` : `Master's applicant with a strong academic record and hands-on data analysis experience.`);

  const edus = d.education.filter(e => e.title || e.org);
  if (edus.length) {
    L.push(``);
    L.push(`\\section*{Education}`);
    edus.forEach(e => {
      const dates = [e.start, e.end].filter(Boolean).join(" -- ");
      const detail = [e.location, d.gpa && e === edus[0] ? `GPA: ${d.gpa}${d.gradingScale ? ` (${d.gradingScale})` : ""}` : ""].filter(Boolean).join(", ");
      L.push(`\\entry{${pipe(e.title || "Degree")}}{${pipe(dates)}}{${pipe(detail)}}`);
      const extra = [d.thesis && e === edus[edus.length - 1] ? `Thesis: ${d.thesis}` : "", e === edus[0] && d.relevantCourses ? `Relevant coursework: ${d.relevantCourses}` : "", ...(e.bullets || []).filter(Boolean)].filter(Boolean);
      if (extra.length) {
        L.push(`\\begin{itemize}`);
        extra.forEach(b => L.push(`\\item ${pipe(b)}`));
        L.push(`\\end{itemize}`);
      }
    });
  }

  if (d.hasExperience) {
    const exps = d.experience.filter(e => e.title || e.org);
    if (exps.length) {
      L.push(``);
      L.push(`\\section*{Professional Experience}`);
      exps.forEach(e => {
        const dates = [e.start, e.end].filter(Boolean).join(" -- ") || "Dates";
        L.push(`\\entry{${pipe(e.org || "Employer")} -- ${pipe(e.title || "Role")}}{${pipe(dates)}}{${pipe(e.location)}}`);
        const bl = (e.bullets || []).filter(Boolean);
        if (bl.length) {
          L.push(`\\begin{itemize}`);
          bl.forEach(b => L.push(`\\item ${pipe(b)}`));
          L.push(`\\end{itemize}`);
        }
      });
    }
  }

  const projs = d.projects.filter(p => p.title || p.org);
  if (projs.length) {
    L.push(``);
    L.push(`\\section*{Projects}`);
    projs.forEach(p => {
      const dates = [p.start, p.end].filter(Boolean).join(" -- ");
      L.push(`\\textbf{${pipe(p.title || "Project")}}${p.org ? ` (${pipe(p.org)})` : ""}${dates ? ` -- ${pipe(dates)}` : ""}${p.location ? `, ${pipe(p.location)}` : ""}\\par`);
      (p.bullets || []).filter(Boolean).forEach(b => L.push(`${pipe(b)}\\par\\vspace{2pt}`));
    });
  }

  const extras = (d.extras || "").split("\n").map(s => s.trim()).filter(Boolean);
  if (extras.length) {
    L.push(``);
    L.push(`\\section*{Leadership, Awards \\& Activities}`);
    L.push(`\\begin{itemize}`);
    extras.forEach(x => {
      const m = x.match(/^(.+?):\s*(.+)$/);
      L.push(m ? `\\item \\textbf{${pipe(m[1])}:} ${pipe(m[2])}` : `\\item ${pipe(x)}`);
    });
    L.push(`\\end{itemize}`);
  }

  const s = d.skills;
  const skillLines = [
    s.office && `\\textbf{Office \\& reporting:} ${pipe(s.office)}`,
    s.stats && `\\textbf{Statistics:} ${pipe(s.stats)}`,
    s.tools && `\\textbf{Data \\& tools:} ${pipe(s.tools)}`,
    s.languages && `\\textbf{Languages:} ${pipe(s.languages)}`,
    d.languageTests && `\\textbf{Language tests:} ${pipe(d.languageTests)}`,
    d.standardizedTests && `\\textbf{Standardized tests:} ${pipe(d.standardizedTests)}`,
  ].filter(Boolean);
  if (skillLines.length) {
    L.push(``);
    L.push(`\\section*{Skills \\& Languages}`);
    L.push(skillLines.join("\\\\"));
  }

  L.push(`\\end{document}`);
  return L.join("\n");
}

// ---------- Small components ----------
function Field({ label, hint, children }) {
  return (
    <label className="block mb-3">
      <span className="block text-xs font-semibold text-slate-600 mb-1">{label}</span>
      {children}
      {hint && <span className="block text-[11px] text-slate-400 mt-1">{hint}</span>}
    </label>
  );
}
const inputCls = "w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-500 bg-white";

function EntryCard({ title, children, onRemove, removable }) {
  return (
    <div className="rounded-xl border border-slate-200 bg-slate-50/60 p-4 mb-3">
      <div className="flex items-center justify-between mb-2">
        <span className="text-xs font-bold uppercase tracking-wide text-slate-500">{title}</span>
        {removable && <button onClick={onRemove} className="text-xs text-red-500 hover:text-red-700 font-medium">Remove</button>}
      </div>
      {children}
    </div>
  );
}

function Bullets({ bullets, onChange, suggestions }) {
  return (
    <div>
      {bullets.map((b, i) => (
        <div key={i} className="flex gap-2 mb-2">
          <input className={inputCls} value={b} placeholder="Achievement bullet (start with a verb, add numbers)"
            onChange={(e) => { const n = [...bullets]; n[i] = e.target.value; onChange(n); }} />
          <button className="text-slate-400 hover:text-red-500 px-1" onClick={() => onChange(bullets.filter((_, j) => j !== i))}>✕</button>
        </div>
      ))}
      <div className="flex flex-wrap gap-2 items-center">
        <button className="text-xs font-medium text-blue-600 hover:text-blue-800" onClick={() => onChange([...bullets, ""])}>+ Add bullet</button>
        {suggestions && bullets.filter(Boolean).length === 0 && suggestions.map((s, i) => (
          <button key={i} className="text-[11px] rounded-full bg-blue-50 text-blue-700 px-2 py-1 hover:bg-blue-100" onClick={() => onChange([s])}>✨ {s}</button>
        ))}
      </div>
    </div>
  );
}

// ---------- Main App ----------
function App() {
  const [data, setData] = useState(() => {
    try { const saved = localStorage.getItem("latex-cv-builder-data"); if (saved) return { ...initialData, ...JSON.parse(saved) }; } catch (e) {}
    return initialData;
  });
  const [step, setStep] = useState(0);
  const [tab, setTab] = useState("preview");
  const [copied, setCopied] = useState(false);

  useEffect(() => { try { localStorage.setItem("latex-cv-builder-data", JSON.stringify(data)); } catch (e) {} }, [data]);
  const set = (k, v) => setData((d) => ({ ...d, [k]: v }));
  const setSkill = (k, v) => setData((d) => ({ ...d, skills: { ...d.skills, [k]: v } }));

  const latex = useMemo(() => buildLatex(data), [data]);

  const completeness = useMemo(() => {
    const checks = [
      data.fullName, data.email, data.city, data.headline,
      data.education.some(e => e.title || e.org), data.gpa,
      data.hasExperience ? data.experience.some(e => e.title || e.org) : true,
      data.experience.some(e => (e.bullets || []).some(Boolean)),
      data.projects.some(p => p.title), data.skills.tools, data.skills.languages,
      data.extras, data.targetProgram,
    ];
    return Math.round((checks.filter(Boolean).length / checks.length) * 100);
  }, [data]);

  const download = () => {
    const blob = new Blob([latex], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (data.fullName || "cv").replace(/\s+/g, "_").toLowerCase() + "_CV.tex";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  const copy = async () => {
    try { await navigator.clipboard.writeText(latex); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) {}
  };

  // Visual preview (HTML approximation of the LaTeX output)
  const Preview = () => {
    const edus = data.education.filter(e => e.title || e.org);
    const exps = data.hasExperience ? data.experience.filter(e => e.title || e.org) : [];
    const projs = data.projects.filter(p => p.title || p.org);
    const extras = (data.extras || "").split("\n").filter(Boolean);
    const Section = ({ t, children }) => children && (
      <div className="mt-3">
        <div className="font-bold text-[#1F3A5F] text-[15px] border-b border-slate-300 pb-0.5">{t}</div>
        <div className="pt-1">{children}</div>
      </div>
    );
    const Entry = ({ left, right, sub, bullets }) => (
      <div className="mb-1.5">
        <div className="flex justify-between text-[13px]"><span className="font-bold">{left}</span><span className="text-slate-600">{right}</span></div>
        {sub && <div className="italic text-[12px] text-slate-700">{sub}</div>}
        {bullets && bullets.filter(Boolean).length > 0 && (
          <ul className="list-disc ml-5 text-[12px] text-slate-800">{bullets.filter(Boolean).map((b, i) => <li key={i}>{b}</li>)}</ul>
        )}
      </div>
    );
    return (
      <div className="bg-white shadow-md rounded-lg p-8 text-slate-900 text-[13px] leading-snug max-w-[210mm] mx-auto" style={{ fontFamily: "Georgia, 'Times New Roman', serif" }}>
        <div className="text-2xl font-bold">{data.fullName || "Your Name"}</div>
        {data.headline && <div className="text-slate-700">{data.headline}</div>}
        <div className="text-[12px] text-slate-700">
          {[data.city, data.phone, data.email, data.github && `github.com/${data.github}`, data.linkedin && `linkedin.com/in/${data.linkedin}`].filter(Boolean).join(" • ")}
        </div>
        {(data.birth || data.nationality) && <div className="text-[12px] text-slate-500">{[data.birth && `Born: ${data.birth}`, data.nationality].filter(Boolean).join(" • ")}</div>}
        <Section t="Profile"><p>{data.targetProgram ? `Target: ${data.targetProgram} (${data.programLanguage}-taught). ` : ""}Master's applicant with a strong academic record and hands-on data analysis experience.</p></Section>
        <Section t="Education">
          {edus.map((e, i) => (
            <Entry key={i} left={e.title || "Degree"} right={[e.start, e.end].filter(Boolean).join(" – ")}
              sub={[e.location, i === 0 && data.gpa ? `GPA: ${data.gpa}${data.gradingScale ? ` (${data.gradingScale})` : ""}` : ""].filter(Boolean).join(", ")}
              bullets={[i === edus.length - 1 && data.thesis ? `Thesis: ${data.thesis}` : "", i === 0 && data.relevantCourses ? `Relevant coursework: ${data.relevantCourses}` : "", ...(e.bullets || [])]} />
          ))}
        </Section>
        {exps.length > 0 && <Section t="Professional Experience">
          {eyps.map((e, i) => (
            <Entry key={i} left={`${e.org || "Employer"} – ${e.title || "Role"}`} right={[e.start, e.end].filter(Boolean).join(" – ")} sub={e.location} bullets={e.bullets || []} />
          ))}
        </Section>}
        {projs.length > 0 && <Section t="Projects">
          {projs.map((p, i) => (
            <div key={i} className="mb-1.5">
              <span className="font-bold">{p.title}</span>{p.org && <span> ({p.org})</span>}
              {(p.bullets || []).filter(Boolean).map((b, j) => <div key={j} className="text-[12px]">{b}</div>)}
            </div>
          ))}
        </Section>}
        {extras.length > 0 && <Section t="Leadership, Awards & Activities">
          <ul className="list-disc ml-5 text-[12px]">{extras.map((x, i) => {
            const m = x.match(/^(.+?):\s*(.+)$/);
            return <li key={i}>{m ? <React.Fragment><b>{m[1]}:</b> {m[2]}</React.Fragment> : x}</li>;
          })}</ul>
        </Section>}
        <Section t="Skills & Languages">
          {[data.skills.office && <div key="o"><b>Office & reporting:</b> {data.skills.office}</div>,
            data.skills.stats && <div key="s"><b>Statistics:</b> {data.skills.stats}</div>,
            data.skills.tools && <div key="t"><b>Data & tools:</b> {data.skills.tools}</div>,
            data.skills.languages && <div key="l"><b>Languages:</b> {data.skills.languages}</div>,
            data.languageTests && <div key="lt"><b>Language tests:</b> {data.languageTests}</div>,
            data.standardizedTests && <div key="st"><b>Standardized tests:</b> {data.standardizedTests}</div>
          ].filter(Boolean)}
        </Section>
      </div>
    );
  };

  return (
    <div className="min-h-screen bg-slate-100 text-slate-900">
      <div className="bg-[#1F3A5F] text-white px-6 py-3 flex items-center justify-between sticky top-0 z-10">
        <div>
          <div className="font-bold tracking-tight">LaTeX CV Builder</div>
          <div className="text-[11px] text-blue-200">Master's application CV · inspired by Kickresume, Enhancv & Zety</div>
        </div>
        <div className="flex items-center gap-4">
          <div className="hidden sm:flex items-center gap-2">
            <div className="w-28 h-2 rounded-full bg-blue-900/50 overflow-hidden">
              <div className="h-full bg-emerald-400 transition-all" style={{ width: `${completeness}%` }} />
            </div>
            <span className="text-xs text-blue-100">{completeness}% complete</span>
          </div>
          <button onClick={download} className="rounded-lg bg-emerald-500 hover:bg-emerald-600 px-3 py-1.5 text-sm font-semibold">Download .tex</button>
        </div>
      </div>

      <div className="flex flex-col lg:flex-row">
        <div className="lg:w-[46%] p-6">
          <div className="flex flex-wrap gap-1.5 mb-5">
            {STEPS.map((s, i) => (
              <button key={s} onClick={() => setStep(i)}
                className={`rounded-full px-3 py-1 text-xs font-medium transition ${i === step ? "bg-[#1F3A5F] text-white" : i < step ? "bg-emerald-100 text-emerald-800" : "bg-white text-slate-500 border border-slate-200"}`}>
                {i + 1}. {s}
              </button>
            ))}
          </div>

          {step === 0 && (
            <div>
              <h2 className="font-bold text-lg mb-3">Personal details</h2>
              <Field label="Full name"><input className={inputCls} value={data.fullName} onChange={e => set("fullName", e.target.value)} placeholder="Akhadjon Abubakirov" /></Field>
              <Field label="Headline" hint="e.g. Economics Master's Student | Data Analysis & Finance"><input className={inputCls} value={data.headline} onChange={e => set("headline", e.target.value)} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="City"><input className={inputCls} value={data.city} onChange={e => set("city", e.target.value)} placeholder="Bonn, Germany" /></Field>
                <Field label="Phone"><input className={inputCls} value={data.phone} onChange={e => set("phone", e.target.value)} /></Field>
                <Field label="Email"><input className={inputCls} value={data.email} onChange={e => set("email", e.target.value)} /></Field>
                <Field label="GitHub username" hint="github.com/..."><input className={inputCls} value={data.github} onChange={e => set("github", e.target.value)} /></Field>
              </div>
              <Field label="LinkedIn username (optional)" hint="linkedin.com/in/..."><input className={inputCls} value={data.linkedin} onChange={e => set("linkedin", e.target.value)} /></Field>
              <div className="grid grid-cols-2 gap-3">
                <Field label="Date & place of birth (optional)"><input className={inputCls} value={data.birth} onChange={e => set("birth", e.target.value)} /></Field>
                <Field label="Nationality (optional)"><input className={inputCls} value={data.nationality} onChange={e => set("nationality", e.target.value)} /></Field>
              </div>
            </div>
          )}

          {step === 1 && (
            <div>
              <h2 className="font-bold text-lg mb-3">Education</h2>
              {data.education.map((e, i) => (
                <EntryCard key={i} title={`Education ${i + 1}`} removable={data.education.length > 1}
                  onRemove={() => set("education", data.education.filter((_, j) => j !== i))}>
                  <Field label="Degree"><input className={inputCls} value={e.title} onChange={ev => { const n = [...data.education]; n[i].title = ev.target.value; set("education", n); }} placeholder="M.Sc. Economics" /></Field>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="University"><input className={inputCls} value={e.org} onChange={ev => { const n = [...data.education]; n[i].org = ev.target.value; set("education", n); }} placeholder="University of Bonn" /></Field>
                    <Field label="City, country"><input className={inputCls} value={e.location} onChange={ev => { const n = [...data.education]; n[i].location = ev.target.value; set("education", n); }} /></Field>
                    <Field label="Start"><input className={inputCls} value={e.start} onChange={ev => { const n = [...data.education]; n[i].start = ev.target.value; set("education", n); }} placeholder="Oct 2025" /></Field>
                    <Field label="End (or 'present')"><input className={inputCls} value={e.end} onChange={ev => { const n = [...data.education]; n[i].end = ev.target.value; set("education", n); }} /></Field>
                  </div>
                </EntryCard>
              ))}
              <button className="text-sm font-medium text-blue-600 mb-4" onClick={() => set("education", [...data.education, { title: "", org: "", location: "", start: "", end: "", bullets: [] }])}>+ Add education</button>
              <Field label="Final grade / GPA + grading scale" hint="e.g. 1.7 (German scale) or 3.8/4.0"><input className={inputCls} value={data.gpa} onChange={e => set("gpa", e.target.value)} /></Field>
              <Field label="Grading scale (optional)"><input className={inputCls} value={data.gradingScale} onChange={e => set("gradingScale", e.target.value)} placeholder="German scale, 1.0 best" /></Field>
              <Field label="Thesis title & topic"><textarea rows={2} className={inputCls} value={data.thesis} onChange={e => set("thesis", e.target.value)} /></Field>
              <Field label="Most relevant courses"><textarea rows={2} className={inputCls} value={data.relevantCourses} onChange={e => set("relevantCourses", e.target.value)} placeholder="Econometrics, Financial Economics, Machine Learning for Finance" /></Field>
            </div>
          )}

          {step === 2 && (
            <div>
              <div className="flex items-center justify-between mb-3">
                <h2 className="font-bold text-lg">Work experience</h2>
                <label className="flex items-center gap-2 text-sm">
                  <input type="checkbox" checked={data.hasExperience} onChange={e => set("hasExperience", e.target.checked)} className="rounded" />
                  I have work experience
                </label>
              </div>
              {!data.hasExperience ? (
                <div className="rounded-xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-800">
                  No problem. The experience section is skipped entirely, and your projects, volunteering and coursework will carry the CV. Many master's applicants have no formal experience.
                </div>
              ) : (
                <React.Fragment>
                  {data.experience.map((e, i) => (
                    <EntryCard key={i} title={`Experience ${i + 1}`} removable={data.experience.length > 1}
                      onRemove={() => set("experience", data.experience.filter((_, j) => j !== i))}>
                      <div className="grid grid-cols-2 gap-3">
                        <Field label="Employer"><input className={inputCls} value={e.org} onChange={ev => { const n = [...data.experience]; n[i].org = ev.target.value; set("experience", n); }} /></Field>
                        <Field label="Role"><input className={inputCls} value={e.title} onChange={ev => { const n = [...data.experience]; n[i].title = ev.target.value; set("experience", n); }} /></Field>
                        <Field label="Location"><input className={inputCls} value={e.location} onChange={ev => { const n = [...data.experience]; n[i].location = ev.target.value; set("experience", n); }} placeholder="Remote" /></Field>
                        <div className="grid grid-cols-2 gap-2">
                          <Field label="Start"><input className={inputCls} value={e.start} onChange={ev => { const n = [...data.experience]; n[i].start = ev.target.value; set("experience", n); }} /></Field>
                          <Field label="End"><input className={inputCls} value={e.end} onChange={ev => { const n = [...data.experience]; n[i].end = ev.target.value; set("experience", n); }} /></Field>
                        </div>
                      </div>
                      <Field label="What did you do? Results with numbers if possible">
                        <Bullets bullets={e.bullets} onChange={b => { const n = [...data.experience]; n[i].bullets = b; set("experience", n); }}
                          suggestions={["Managed ~100 requests/day across operations and support", "Prepared daily and monthly reports for management review", "Used Python to clean and analyse operational data"]} />
                      </Field>
                    </EntryCard>
                  ))}
                  <button className="text-sm font-medium text-blue-600" onClick={() => set("experience", [...data.experience, emptyEntry()])}>+ Add experience</button>
                </React.Fragment>
              )}
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 className="font-bold text-lg mb-3">Projects & research</h2>
              {data.projects.map((p, i) => (
                <EntryCard key={i} title={`Project ${i + 1}`} removable={data.projects.length > 1}
                  onRemove={() => set("projects", data.projects.filter((_, j) => j !== i))}>
                  <div className="grid grid-cols-2 gap-3">
                    <Field label="Project name"><input className={inputCls} value={p.title} onChange={ev => { const n = [...data.projects]; n[i].title = ev.target.value; set("projects", n); }} /></Field>
                    <Field label="Tools used"><input className={inputCls} value={p.org} onChange={ev => { const n = [...data.projects]; n[i].org = ev.target.value; set("projects", n); }} placeholder="Python, Pandas, Django" /></Field>
                    <Field label="Start"><input className={inputCls} value={p.start} onChange={ev => { const n = [...data.projects]; n[i].start = ev.target.value; set("projects", n); }} /></Field>
                    <Field label="End"><input className={inputCls} value={p.end} onChange={ev => { const n = [...data.projects]; n[i].end = ev.target.value; set("projects", n); }} /></Field>
                  </div>
                  <Field label="Description"><Bullets bullets={p.bullets} onChange={b => { const n = [...data.projects]; n[i].bullets = b; set("projects", n); }} /></Field>
                </EntryCard>
              ))}
              <button className="text-sm font-medium text-blue-600" onClick={() => set("projects", [...data.projects, emptyEntry()])}>+ Add project</button>
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 className="font-bold text-lg mb-3">Skills & languages</h2>
              <Field label="Office & reporting"><input className={inputCls} value={data.skills.office} onChange={e => setSkill("office", e.target.value)} placeholder="Excel (Pivot Tables, VLOOKUP), operational reporting" /></Field>
              <Field label="Statistics & methods"><input className={inputCls} value={data.skills.stats} onChange={e => setSkill("stats", e.target.value)} placeholder="Econometrics, regression, hypothesis testing" /></Field>
              <Field label="Data & tools"><input className={inputCls} value={data.skills.tools} onChange={e => setSkill("tools", e.target.value)} placeholder="Python (Pandas, NumPy), SQL, Git, Django" /></Field>
              <Field label="Languages with levels (A1–C2)"><input className={inputCls} value={data.skills.languages} onChange={e => setSkill("languages", e.target.value)} placeholder="Uzbek (native), English (C1), German (A2)" /></Field>
              <Field label="Language tests taken (score + date)"><input className={inputCls} value={data.languageTests} onChange={e => set("languageTests", e.target.value)} placeholder="IELTS 7.5 (2025), TestDaF 4,4,4,4" /></Field>
              <Field label="GRE / GMAT / TestAS (if taken)"><input className={inputCls} value={data.standardizedTests} onChange={e => set("standardizedTests", e.target.value)} placeholder="GRE 320 (2025) or leave empty" /></Field>
            </div>
          )}

          {step === 5 && (
            <div>
              <h2 className="font-bold text-lg mb-3">Extras & target program</h2>
              <Field label="Scholarships, awards, volunteering, extracurriculars" hint="One per line. Format 'Name: what you did' for bold names.">
                <textarea rows={4} className={inputCls} value={data.extras} onChange={e => set("extras", e.target.value)} placeholder={"FinLit.uz (volunteer): organised educational events\nZakovat competition: 3rd place in team of five"} />
              </Field>
              <Field label="Timeline gaps: short explanation (optional)"><textarea rows={2} className={inputCls} value={data.gapExplanation} onChange={e => set("gapExplanation", e.target.value)} placeholder="e.g. 2023: intensive German language study (B1→C1)" /></Field>
              <Field label="Target program & university"><input className={inputCls} value={data.targetProgram} onChange={e => set("targetProgram", e.target.value)} placeholder="M.Sc. Economics, University of Bonn" /></Field>
              <Field label="Program language">
                <select className={inputCls} value={data.programLanguage} onChange={e => set("programLanguage", e.target.value)}>
                  <option>English</option><option>German</option><option>English & German</option>
                </select>
              </Field>
              <Field label="Special requirements (uni-assist, prerequisite credits, etc.)"><textarea rows={2} className={inputCls} value={data.specialRequirements} onChange={e => set("specialRequirements", e.target.value)} /></Field>
              <div className="mt-6 flex justify-between">
                <button onClick={() => setStep(Math.max(0, step - 1))} className="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium">← Back</button>
                <button onClick={() => setStep(Math.min(STEPS.length - 1, step + 1))} className="rounded-lg bg-[#1F3A5F] text-white px-4 py-2 text-sm font-semibold">Next →</button>
              </div>
            </div>
          )}

          {step < 5 && (
            <div className="mt-6 flex justify-between">
              <button onClick={() => setStep(Math.max(0, step - 1))} disabled={step === 0} className="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-medium disabled:opacity-40">← Back</button>
              <button onClick={() => setStep(step + 1)} className="rounded-lg bg-[#1F3A5F] text-white px-4 py-2 text-sm font-semibold">Next →</button>
            </div>
          )}
        </div>

        <div className="lg:w-[54%] bg-slate-200/70 p-6 border-t lg:border-t-0 lg:border-l border-slate-300">
          <div className="flex items-center justify-between mb-3">
            <div className="flex gap-1 rounded-lg bg-white p-1 shadow-sm">
              {["preview", "latex"].map(t => (
                <button key={t} onClick={() => setTab(t)}
                  className={`rounded-md px-3 py-1 text-xs font-semibold capitalize ${tab === t ? "bg-[#1F3A5F] text-white" : "text-slate-600"}`}>
                  {t === "latex" ? "LaTeX code" : "Live preview"}
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <button onClick={copy} className="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium hover:bg-slate-50">{copied ? "✓ Copied" : "Copy LaTeX"}</button>
              <button onClick={download} className="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-medium hover:bg-slate-50">Download .tex</button>
              <a href="https://www.overleaf.com" target="_blank" rel="noreferrer" className="rounded-lg bg-emerald-600 text-white px-3 py-1.5 text-xs font-semibold hover:bg-emerald-700">Compile on Overleaf ↗</a>
            </div>
          </div>
          {tab === "preview" ? (
            <div className="overflow-auto max-h-[80vh]"><Preview /></div>
          ) : (
            <pre className="rounded-xl bg-slate-900 text-emerald-200 text-[11px] leading-relaxed p-4 overflow-auto max-h-[80vh] whitespace-pre-wrap">{latex}</pre>
          )}
          <p className="text-[11px] text-slate-500 mt-3">
            Download the .tex file and upload it to Overleaf to get your PDF. Everything is saved in your browser automatically.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
